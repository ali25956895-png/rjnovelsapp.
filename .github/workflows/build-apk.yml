name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Full Flutter App Skeleton
        run: |
          rm -rf *
          flutter create . --org com.rjking.novels --project-name rj_king_novels

      - name: Restore Custom Application Files
        run: |
          git checkout HEAD -- main.dart pubspec.yaml
          mv main.dart lib/main.dart

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: rj-king-novels-app
          path: build/app/outputs/flutter-apk/app-release.apk
